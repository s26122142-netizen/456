<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>復古風格 - 朋友對我的動態留言板</title>
  
  <!-- 引入復古風格字體 (Press Start 2P) -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">

  <style>
    /* =========================================================
       1. 全局樣式與主題配色設定 (可在這裡調整復古色彩)
       ========================================================= */
    :root {
      /* 【顏色設定】 */
      --bg-color: #120428;           /* 主背景色：深紫夜空 */
      --card-bg: #22123b;            /* 卡片背景色：暗紫 */
      --text-color: #00ffcc;         /* 內文顏色：復古螢光綠 */
      --title-color: #ff007f;        /* 標題顏色：霓虹粉紅 */
      --author-color: #ffdd57;       /* 署名顏色：復古鮮黃 */
      --highlight-color: #00ffff;    /* 亮起卡片邊框/發光色：青藍霓虹 */
      --dim-opacity: 0.35;           /* 未選中卡片的透明度 */
      --blur-val: 2px;               /* 未選中卡片的模糊程度 */

      /* 【輪播動畫轉場速度】 */
      --transition-speed: 0.5s;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Noto Sans TC', sans-serif;
      min-height: 100vh;
      padding: 20px;
      /* 復古掃描線背景紋理 */
      background-image: linear-gradient(rgba(18, 4, 40, 0) 50%, rgba(0, 0, 0, 0.4) 50%);
      background-size: 100% 4px;
    }

    /* =========================================================
       2. 標題與頁首樣式
       ========================================================= */
    header {
      text-align: center;
      margin-bottom: 30px;
      padding: 20px 0;
    }

    h1 {
      font-family: 'Press Start 2P', 'Noto Sans TC', cursive;
      color: var(--title-color);
      font-size: 2rem;
      text-shadow: 3px 3px 0px #00ffff, -2px -2px 0px #ff007f;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    p.subtitle {
      color: #aaa;
      font-size: 0.9rem;
      letter-spacing: 1px;
    }

    /* =========================================================
       3. 載入中動畫 (Cool Loading Animation)
       ========================================================= */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 80px 0;
    }

    .pixel-spinner {
      width: 50px;
      height: 50px;
      border: 6px solid var(--card-bg);
      border-top: 6px solid var(--title-color);
      border-right: 6px solid var(--highlight-color);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      box-shadow: 0 0 15px var(--title-color);
    }

    .loading-text {
      margin-top: 20px;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.9rem;
      color: var(--title-color);
      animation: blink 1s infinite alternate;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes blink {
      0% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    /* =========================================================
       4. 瀑布流排版 (Masonry Layout)
       ========================================================= */
    .masonry-wall {
      /* 設定欄數：電腦預設 3 欄 */
      column-count: 3;
      column-gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* RWD 響應式調整 */
    @media (max-width: 900px) {
      .masonry-wall { column-count: 2; }
    }
    @media (max-width: 600px) {
      .masonry-wall { column-count: 1; }
    }

    /* =========================================================
       5. 留言卡片樣式與亮起 (Highlight) 動效
       ========================================================= */
    .message-card {
      background-color: var(--card-bg);
      border: 3px solid #4a2180;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      /* 防止卡片在瀑布流中被截斷 */
      break-inside: avoid;
      
      /* 預設轉場平滑度 */
      transition: transform var(--transition-speed) ease,
                  box-shadow var(--transition-speed) ease,
                  opacity var(--transition-speed) ease,
                  filter var(--transition-speed) ease,
                  border-color var(--transition-speed) ease;
      
      position: relative;
      box-shadow: 4px 4px 0px #000;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px dashed #55288c;
      padding-bottom: 8px;
      margin-bottom: 12px;
    }

    .card-author {
      font-weight: bold;
      color: var(--author-color);
      font-size: 1.1rem;
    }

    .card-time {
      font-size: 0.75rem;
      color: #888;
    }

    .card-content {
      line-height: 1.6;
      white-space: pre-wrap; /* 保留留言中的換行 */
      word-break: break-word;
      font-size: 0.95rem;
    }

    /* ---------------------------------------------------------
       【輪播重點】亮起 (Highlight) 與 變暗 (Dim) 樣式
       --------------------------------------------------------- */
    /* 1. 當卡片被選中亮起時 */
    .message-card.highlight {
      transform: scale(1.05); /* 放大 */
      border-color: var(--highlight-color); /* 亮色邊框 */
      box-shadow: 0 0 20px var(--highlight-color), 0 0 10px var(--title-color); /* 霓虹發光 */
      opacity: 1;
      filter: blur(0px);
      z-index: 10; /* 確保放大的卡片蓋在上方 */
    }

    /* 2. 當其他卡片被相對變暗時 (背景展覽模式) */
    .masonry-wall.carousel-active .message-card:not(.highlight) {
      opacity: var(--dim-opacity); /* 變暗 */
      filter: blur(var(--blur-val)); /* 變模糊 */
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <header>
    <h1>RETRO BOARD</h1>
    <p class="subtitle">━ 朋友對我的動態留言板 ━</p>
  </header>

  <!-- 讀取中動畫區塊 -->
  <div id="loading">
    <div class="pixel-spinner"></div>
    <div class="loading-text">LOADING MESSAGES...</div>
  </div>

  <!-- 留言牆容器 (瀑布流) -->
  <main id="wall" class="masonry-wall" style="display: none;"></main>

  <script>
    /* =========================================================
       6. 參數控制區 (可在此調整輪播秒數與資料來源)
       ========================================================= */
    // 【輪播時間設定】單位為毫秒 (3000ms = 3 秒)
    const CAROUSEL_INTERVAL_MS = 3000;

    // Google 試算表 CSV 網址
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQeVt1BjuEQPvpNKo346wEZpdnL3bafTbpm5jj20-ttZezRVACPF2hafMH9zJbEVQVC0KGO7O4o3D_p/pub?output=csv";

    // 全局變數
    let messages = [];          // 儲存解析後的留言資料
    let cardElements = [];      // 儲存 DOM 中的卡片元素
    let currentIndex = -1;      // 當前亮起的卡片索引
    let carouselTimer = null;   // 計時器物件

    /* =========================================================
       7. 強健的 CSV 解析器 (能夠處理雙引號、逗號與換行)
       ========================================================= */
    function parseCSV(text) {
      const result = [];
      let row = [];
      let entry = '';
      let insideQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
          if (insideQuotes && nextChar === '"') { // 處理轉義雙引號 ""
            entry += '"';
            i++;
          } else {
            insideQuotes = !insideQuotes; // 切換雙引號狀態
          }
        } else if (char === ',' && !insideQuotes) {
          row.push(entry.trim());
          entry = '';
        } else if ((char === '\r' || char === '\n') && !insideQuotes) {
          if (char === '\r' && nextChar === '\n') i++;
          row.push(entry.trim());
          if (row.length > 1 || row[0] !== '') {
            result.push(row);
          }
          row = [];
          entry = '';
        } else {
          entry += char;
        }
      }
      if (entry || row.length > 0) {
        row.push(entry.trim());
        result.push(row);
      }
      return result;
    }

    /* =========================================================
       8. 主程式：讀取資料與初次渲染
       ========================================================= */
    async function initApp() {
      const loadingEl = document.getElementById('loading');
      const wallEl = document.getElementById('wall');

      try {
        const response = await fetch(CSV_URL);
        if (!response.ok) throw new Error('網路回應錯誤');
        
        const csvText = await response.text();
        const parsedRows = parseCSV(csvText);

        // 排除標題列 (第一列: 時間戳記, 姓名, 跟我說悄悄話)
        const dataRows = parsedRows.slice(1);

        // 格式化資料
        messages = dataRows.map(row => {
          return {
            timestamp: row[0] || '未知時間',
            name: row[1] || '匿名朋友',
            content: row[2] || '（無留言內容）'
          };
        }).filter(item => item.content !== '（無留言內容）'); // 濾掉完全空白的內容

        // 隱藏 Loading，顯示留言牆
        loadingEl.style.display = 'none';
        wallEl.style.display = 'block';

        if (messages.length === 0) {
          wallEl.innerHTML = '<div style="text-align:center; grid-column:1/-1;">目前還沒有任何留言喔！</div>';
          return;
        }

        // 動態生成卡片
        renderCards(messages);

        // 開啟隨時間輪播特效
        startCarousel();

      } catch (error) {
        console.error('讀取失敗:', error);
        loadingEl.innerHTML = `<div class="loading-text" style="color:#ff3366;">讀取資料失敗，請檢查網路或網址！</div>`;
      }
    }

    /* =========================================================
       9. 動態生成卡片 HTML
       ========================================================= */
    function renderCards(data) {
      const wallEl = document.getElementById('wall');
      wallEl.innerHTML = '';

      data.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'message-card';
        card.setAttribute('data-index', index);

        // 填入卡片內容
        card.innerHTML = `
          <div class="card-header">
            <span class="card-author">👤 ${escapeHTML(item.name)}</span>
            <span class="card-time">${escapeHTML(item.timestamp)}</span>
          </div>
          <div class="card-content">${escapeHTML(item.content)}</div>
        `;

        wallEl.appendChild(card);
      });

      // 取得所有已生成的卡片元素，方便輪播控制
      cardElements = document.querySelectorAll('.message-card');
    }

    /* 簡單的 HTML 轉義函數，防止 XSS 攻擊 */
    function escapeHTML(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    /* =========================================================
       10. 隨時間輪播亮起特效 (Highlight Carousel)
       ========================================================= */
    function startCarousel() {
      if (cardElements.length === 0) return;

      const wallEl = document.getElementById('wall');
      
      // 啟動牆面「輪播中」狀態（讓沒被選擇的卡片變暗/模糊）
      wallEl.classList.add('carousel-active');

      // 第一次先手動觸發第一張卡片亮起
      highlightNextCard();

      // 設定計時器，每隔指定秒數切換下一張
      carouselTimer = setInterval(() => {
        highlightNextCard();
      }, CAROUSEL_INTERVAL_MS);
    }

    function highlightNextCard() {
      // 1. 移除上一張卡片的 highlight 樣式
      if (currentIndex >= 0 && cardElements[currentIndex]) {
        cardElements[currentIndex].classList.remove('highlight');
      }

      // 2. 計算下一張卡片的 index（輪播循環）
      currentIndex = (currentIndex + 1) % cardElements.length;

      // 3. 幫當前卡片加上 highlight 樣式
      const currentCard = cardElements[currentIndex];
      currentCard.classList.add('highlight');

      // 4. (可選) 自動平滑滾動到當前 Highlight 的卡片可視範圍內
      currentCard.scrollIntoView({
        behavior: 'smooth',
        block: 'nearest'
      });
    }

    // 當頁面載入完成後執行主程式
    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
